name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: repository validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
      - name: Validate repository (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/Test-Repository.ps1
