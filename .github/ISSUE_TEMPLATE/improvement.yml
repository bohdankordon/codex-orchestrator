name: Improvement
description: Propose a change to the workflow, its role contracts, routing, documentation, or tooling.
title: "improvement: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not working well today, and where it shows up.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you want to change. Be specific about the rule, role, route, or file.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you considered, and why you set them aside.
    validations:
      required: false
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Which of correctness, confidence, evidence quality, parallelism, context isolation, risk, or cost improves, and how.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Benchmark considerations
      description: Which evidence layer would show this worked, and what it would cost to obtain. See docs/benchmarking.md.
    validations:
      required: false
